name: Build, Sign & Release (Windows)

# Manual trigger by default — this creates a public GitHub Release and
# a signed executable, so it should be a deliberate action, not
# something that fires on every push. Change to `push: branches:[main]`
# once you're happy with that.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number for the tag (v{date}-{build_number})"
        required: true
        default: "01"

permissions:
  contents: write   # required to create tags/releases

jobs:
  build-sign-release:
    runs-on: windows-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get short commit hash
        id: vars
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y-%m-%d)-${{ github.event.inputs.build_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight - check bundled assets exist
        shell: bash
        run: |
          missing=0
          for f in "assets/mt5_color_match_guide.jpg" "guides/mt5_color_match_guide.jpg" "mq5/AEGIS_Executor.mq5"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required asset: $f"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::One or more bundled assets are missing. See aegis_capture.spec comments for how to build without them if that's intentional."
            exit 1
          fi

      - name: Build with PyInstaller
        run: pyinstaller aegis_capture.spec

      - name: Rename build output to requested filename
        shell: bash
        run: |
          mkdir -p release_out
          cp "dist/AEGIS_Capture.exe" "release_out/AegisCapture-Win.exe"

      # ------------------------------------------------------------------
      # Code signing. Requires these repo secrets to be set beforehand
      # (Settings -> Secrets and variables -> Actions):
      #   WINDOWS_CERT_PFX_BASE64  - your Authenticode .pfx, base64-encoded
      #   WINDOWS_CERT_PASSWORD    - the .pfx password
      # If these secrets are absent, this step is skipped and the exe
      # ships unsigned (Windows SmartScreen will warn users).
      # ------------------------------------------------------------------
      - name: Sign executable
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $certBytes)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "release_out\AegisCapture-Win.exe"
          & $signtool verify /pa "release_out\AegisCapture-Win.exe"

      - name: Warn if unsigned
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 == '' }}
        run: echo "::warning::WINDOWS_CERT_PFX_BASE64 secret not set - shipping an UNSIGNED executable. Add the secret to enable signing."

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" AEGIS_Setup.iss
          Copy-Item "Output\AEGIS_Capture_Setup.exe" "release_out\AegisCapture-Win-Setup.exe"

      - name: Sign installer
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "release_out\AegisCapture-Win-Setup.exe"

      - name: Create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.vars.outputs.tag }}
          git push origin ${{ steps.vars.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "AEGIS Capture (Windows) ${{ steps.vars.outputs.tag }}"
          body: |
            Automated build from commit `${{ steps.vars.outputs.sha_short }}` on `main`.
            Signed: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' }}
          files: |
            release_out/AegisCapture-Win.exe
            release_out/AegisCapture-Win-Setup.exe

      - name: Summary
        shell: bash
        run: |
          echo "### AEGIS Capture (Windows) release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: ${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ steps.vars.outputs.sha_short }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: see the Releases page for this repo" >> "$GITHUB_STEP_SUMMARY"
